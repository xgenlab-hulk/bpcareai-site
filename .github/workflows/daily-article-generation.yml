name: Daily Article Generation & Deployment

on:
  # 每天北京时间 14:00 执行 (UTC 06:00)
  schedule:
    - cron: '0 6 * * *'

  workflow_dispatch:
    inputs:
      articles_count:
        description: 'Override article count (leave empty for auto-detection based on day)'
        required: false
        type: number

permissions:
  contents: write

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
      GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Generate articles
        env:
          ARTICLES_COUNT_OVERRIDE: ${{ inputs.articles_count }}
        run: |
          if [ -n "$ARTICLES_COUNT_OVERRIDE" ]; then
            echo "🎯 Generating articles with override count: $ARTICLES_COUNT_OVERRIDE..."
          else
            echo "🎯 Generating articles with auto-detection..."
          fi
          npm run auto:generate

      - name: Rebuild articles index
        run: npm run build:articles-index

      - name: Commit and push changes
        run: |
          git add -A

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            TODAY=$(date +'%Y-%m-%d')
            NEW_ARTICLES=$(git diff --staged --name-only | grep -c "content/articles/.*\.md" || true)
            git commit -m "chore: daily generation - ${TODAY} - ${NEW_ARTICLES} articles [skip ci]"
            git push origin main
            echo "✅ Committed and pushed ${NEW_ARTICLES} new articles"
          fi

      - name: Report
        if: always()
        run: |
          echo "## Daily Generation Report - $(date +'%Y-%m-%d')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          TOTAL_ARTICLES=$(find content/articles -name "*.md" 2>/dev/null | wc -l)
          echo "📊 **Total articles**: ${TOTAL_ARTICLES}" >> $GITHUB_STEP_SUMMARY
          TOPIC_COUNT=0
          for f in data/planned-topics-*.json; do
            if [ -f "$f" ]; then
              COUNT=$(grep -c '"title"' "$f" || echo "0")
              TOPIC_COUNT=$((TOPIC_COUNT + COUNT))
            fi
          done
          echo "📚 **Topics remaining**: ${TOPIC_COUNT}" >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        run: |
          echo "## ❌ Daily Generation Failed" >> $GITHUB_STEP_SUMMARY
          echo "**Date**: $(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
