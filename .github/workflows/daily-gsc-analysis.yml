name: Daily GSC Analysis + Urgent Topics

on:
  # 每天北京时间 08:00 执行 (UTC 00:00)
  schedule:
    - cron: '0 0 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  gsc-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
      GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: 'GSC daily analysis + trend detection + urgent topics'
        run: |
          echo "📊 Running GSC daily analysis..."
          npm run seo:daily

      - name: Commit and push GSC data
        run: |
          git add -A

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            TODAY=$(date +'%Y-%m-%d')
            git commit -m "chore: GSC daily analysis - ${TODAY} [skip ci]"
            git push origin main
            echo "✅ GSC data committed"
          fi

      - name: Report
        if: always()
        run: |
          echo "## GSC Daily Analysis - $(date +'%Y-%m-%d')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d "data/seo/raw" ]; then
            DAYS=$(ls data/seo/raw/*.json 2>/dev/null | wc -l)
            echo "📊 **GSC data days**: ${DAYS}" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f "data/seo/urgent-topics.json" ]; then
            URGENT=$(grep -c '"query"' data/seo/urgent-topics.json 2>/dev/null || echo "0")
            echo "🚨 **Urgent topics**: ${URGENT}" >> $GITHUB_STEP_SUMMARY
          fi
