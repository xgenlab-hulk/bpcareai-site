name: Weekly Topic Refresh (Line 2)

on:
  # 每周六北京时间 09:00 执行 (UTC 01:00) - DISABLED until ready
  # schedule:
  #   - cron: '0 1 * * 6'

  # 支持手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-topics:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
      GOOGLE_SEO_CLIENT_ID: ${{ secrets.GOOGLE_SEO_CLIENT_ID }}
      GOOGLE_SEO_CLIENT_SECRET: ${{ secrets.GOOGLE_SEO_CLIENT_SECRET }}
      GOOGLE_SEO_REFRESH_TOKEN: ${{ secrets.GOOGLE_SEO_REFRESH_TOKEN }}
      GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      # Pull latest GSC data first (Line 1 data feeds Line 2)
      - name: 'Line 1: Pull latest GSC data'
        run: |
          echo "📊 Pulling latest GSC data for weekly analysis..."
          npm run seo:daily || echo "⚠️ GSC pull failed (non-fatal), using existing data..."

      # Run weekly topic refresh (Line 2)
      - name: 'Line 2: Weekly topic refresh + scoring'
        run: |
          echo "🧠 Running weekly topic refresh..."
          npm run seo:weekly

      - name: Commit and push updated topics
        run: |
          git add -A

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            WEEK=$(date +'%Y-W%V')
            COMMIT_MSG="chore: weekly topic refresh - ${WEEK} [skip ci]"

            git commit -m "$COMMIT_MSG"
            git push origin main

            echo "✅ Topic library refreshed for ${WEEK}"
          fi

      - name: Weekly report
        if: always()
        run: |
          echo "## Weekly Topic Refresh - $(date +'%Y-W%V')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          TOPIC_COUNT=0
          for f in data/planned-topics-*.json; do
            if [ -f "$f" ]; then
              NAME=$(basename "$f" .json | sed 's/planned-topics-//')
              COUNT=$(grep -c '"title"' "$f" || echo "0")
              TOPIC_COUNT=$((TOPIC_COUNT + COUNT))
              echo "- **${NAME}**: ${COUNT} topics" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📚 **Total topics**: ${TOPIC_COUNT}" >> $GITHUB_STEP_SUMMARY
